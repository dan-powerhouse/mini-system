project_id = "entitygraph-local"
[api]
enabled = true
port = 54321
# RPC + PostgREST only; pg_graphql is removed by 20261126170020_native_platform.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
# Identity host (apps/identity). Production values are set per remote project.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:43127/"]
# Registry RPCs reject anonymous sessions; keep them off at the issuer too.
enable_anonymous_sign_ins = false

# Native OAuth 2.1 server; consent UI is apps/identity/app/oauth/consent.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[edge_runtime.secrets]
# Shared with Vault secret `exchange_cleanup_secret` (Cron -> exchange-cleanup).
EXCHANGE_CLEANUP_SECRET = "env(EXCHANGE_CLEANUP_SECRET)"
[storage]
enabled = true
file_size_limit = "20MiB"

# Private buckets are created by migrations; declared here so local stacks and
# `supabase config push` keep the same limits (20 MiB = Edge MAX_BYTES).
[storage.buckets.process-kind-packages]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/zip"]

[storage.buckets.registry-exchange]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/zip"]

[storage.buckets.process-artifacts]
public = false

[functions.mcp]
enabled = false
verify_jwt = false
entrypoint = "./functions/mcp/index.ts"

[functions.import]
enabled = false
verify_jwt = false
entrypoint = "./functions/import/index.ts"

[functions.export]
enabled = false
verify_jwt = false
entrypoint = "./functions/export/index.ts"

[functions.exchange-cleanup]
enabled = false
verify_jwt = false
entrypoint = "./functions/exchange-cleanup/index.ts"

[functions.publish]
enabled = false
verify_jwt = false
entrypoint = "./functions/publish/index.ts"
