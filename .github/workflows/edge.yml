name: Edge gates
on: [pull_request, push]
permissions:
  contents: read
jobs:
  mcp-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: bash scripts/check-edge.sh
